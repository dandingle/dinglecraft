<div id="pause" class="ovl">
  <div class="panel">
    <h2>Paused</h2>
    <button id="p_resume" class="mc-btn">Back to Game</button>
    <button id="p_save" class="mc-btn">Save World</button>
    <button id="p_export" class="mc-btn">Export World</button>
    <button id="p_store" class="mc-btn">💎 DINGLE STORE™</button>
    <button id="p_pow" class="mc-btn">⚡ Superpowers (P)</button>
    <button id="p_settings" class="mc-btn">⚙️ Settings</button>
    <button id="p_help" class="mc-btn">Help &amp; Controls</button>
    <button id="p_patch" class="mc-btn" hidden style="display:none">Patch Notes</button>
    <button id="p_quit" class="mc-btn danger">Save &amp; Quit to Title</button>
  </div>
</div>

<div id="terr" class="ovl">
  <div class="panel" style="max-width:700px">
    <h2>DEEP DIRT 2D <span style="font-size:11px;color:#9a9aa6">on Gaming Rig OS 1.0</span></h2>
    <canvas id="terrcv" width="640" height="400" style="width:100%;max-width:660px;image-rendering:pixelated;background:#000;border:3px solid #26262e;border-radius:6px;cursor:crosshair"></canvas>
    <button id="terrclose" class="mc-btn">Save &amp; Power Off</button>
  </div>
</div>

<div id="scare" style="display:none;position:fixed;inset:0;z-index:95;pointer-events:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.85)">
  <canvas id="scarecv" width="520" height="520" style="max-width:80vmin;max-height:80vmin"></canvas>
</div>

<div id="cine" class="ovl">
  <div class="panel" style="max-width:700px">
    <h2>🎬 DINGLE CINEMA</h2>
    <canvas id="cinecv" width="640" height="360" style="width:100%;max-width:660px;image-rendering:pixelated;background:#000;border:3px solid #26262e;border-radius:6px"></canvas>
    <button id="cineclose" class="mc-btn">Leave the Cinema</button>
  </div>
</div>

<div id="settings" class="ovl">
  <div class="panel">
    <h2>⚙️ Settings</h2>
    <div class="mlabel">UI Scale <span id="s_uiinfo" class="sinfo"></span></div>
    <div id="s_ui" class="seg" role="group" aria-label="UI Scale"><button class="mc-btn" data-ui="auto">Auto</button><button class="mc-btn" data-ui="1">100%</button><button class="mc-btn" data-ui="1.25">125%</button><button class="mc-btn" data-ui="1.5">150%</button><button class="mc-btn" data-ui="2">200%</button></div>
    <div class="mlabel">Render distance: <span id="p_rdv">8</span> chunks (max 32 — heavy!)</div>
    <input id="p_rd" class="range" type="range" min="2" max="32" step="1" value="8">
    <div class="mlabel">Field of view: <span id="s_fovv">75</span>°</div>
    <input id="s_fov" class="range" type="range" min="50" max="110" step="1" value="75">
    <div class="mlabel">Your name</div>
    <input id="s_pname" class="mc-in" maxlength="16" autocomplete="off" spellcheck="false">
    <div class="mlabel">Mouse sensitivity: <span id="s_sensv">100</span>%</div>
    <input id="s_sens" class="range" type="range" min="10" max="300" step="5" value="100">
    <div class="mlabel">Sound volume: <span id="s_sfxv">100</span>%</div>
    <input id="s_sfx" class="range" type="range" min="0" max="100" step="1" value="100">
    <div class="mlabel">Music volume: <span id="s_musv">70</span>%</div>
    <input id="s_mus" class="range" type="range" min="0" max="100" step="1" value="70">
    <div class="sgrid">
    <button id="p_sound" class="mc-btn">Sound: On</button>
    <button id="p_music" class="mc-btn" title="The in-world music. The menu music and records follow the Music volume slider.">World Music: Off</button>
    <button id="p_bright" class="mc-btn">Fullbright: Off</button>
    <button id="s_shaders" class="mc-btn">✨ Shaders: Off</button>
    </div>
    <div class="mlabel">Texture pack</div>
    <select id="s_pack" class="mc-in"><option value="og">OG (16px classic)</option><option value="hr">Hyperreal (cursed PBR)</option></select>
    <div id="s_qrow" style="display:none"><div class="mlabel">Hyperreal quality</div>
    <select id="s_q" class="mc-in"><option value="-1">Auto</option><option value="0">Low</option><option value="1">Medium</option><option value="2">High</option><option value="3">Ultra</option></select></div>
    <div id="s_tpinfo" class="mlabel"></div>
    <div class="sgrid">
    <button id="s_lock" class="mc-btn">Mouse Capture: On</button>
    <button id="p_debug" class="mc-btn">🛠 Debug Menu</button>
    <button id="s_close" class="mc-btn sdone">Done</button>
    </div>
  </div>
</div>

<div id="death" class="ovl">
  <h1>You died!</h1>
  <div id="deathmsg"></div>
  <div class="panel">
    <button id="d_respawn" class="mc-btn">Respawn</button>
    <button id="d_title" class="mc-btn">Save &amp; Quit to Title</button>
  </div>
</div>
